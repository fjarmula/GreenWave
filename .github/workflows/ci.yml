name: CI Pipeline

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  graphify-artifact:
    name: Graphify Artifact Freshness
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Graphify artifact freshness
        run: |
          test -f graphify-out/graph.json
          python - <<'PY'
          import json
          import subprocess
          from pathlib import Path

          graph = json.loads(Path("graphify-out/graph.json").read_text(encoding="utf-8"))
          head = subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip()
          if graph.get("built_at_commit") != head:
              raise SystemExit(
                  "graphify-out/graph.json is stale; run `graphify . --no-viz --code-only` and commit the result"
              )
          PY

  backend-quality:
    name: Backend Check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.3"
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - name: Install dependencies
        run: uv sync --dev --locked

      - name: Ruff lint
        run: uv run ruff check .

      - name: Ruff format
        run: uv run ruff format --check .

      - name: Mypy
        run: uv run mypy

      - name: Pytest
        run: uv run pytest

  frontend-quality:
    name: Frontend Check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: ESLint
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      - name: Prettier
        run: npm run format:check

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build

  contract-drift:
    name: Contract Drift Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.3"
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Regenerate OpenAPI document
        working-directory: backend
        run: |
          uv sync --dev --locked
          uv run python scripts/export_openapi.py

      - name: Regenerate frontend types
        working-directory: frontend
        run: |
          npm ci
          npm run generate:types

      - name: Fail if generated contract files are stale
        run: |
          git add --intent-to-add contracts frontend/src/types
          git diff --exit-code -- contracts frontend/src/types
